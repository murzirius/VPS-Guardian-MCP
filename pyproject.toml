[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-guardian-mcp"
version = "0.23.0"
description = "Secure MCP server for Linux VPS observability, guarded administration, and AI-agent collaboration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "murzirius" }
]
urls = { Homepage = "https://thomas-studios.com/projects/vps-guardian-mcp", Documentation = "https://github.com/murzirius/VPS-Guardian-MCP#readme", Repository = "https://github.com/murzirius/VPS-Guardian-MCP", Changelog = "https://github.com/murzirius/VPS-Guardian-MCP/blob/main/UPDATES.md", Issues = "https://github.com/murzirius/VPS-Guardian-MCP/issues" }
keywords = ["mcp", "model-context-protocol", "vps", "linux", "monitoring", "docker", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "psutil>=5.9.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage[toml]>=7.6",
    "ruff>=0.8",
    "twine>=6.1",
]

[project.scripts]
vps-guardian-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 18
