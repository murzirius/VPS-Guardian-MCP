name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  gateway-ssh:
    name: Gateway real SSH isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install isolated root-owned Gateway
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server python3-venv
          sudo mkdir -p /opt/guardian-gateway-ci
          sudo /usr/bin/python3 -m venv /opt/guardian-gateway-ci/venv
          sudo /opt/guardian-gateway-ci/venv/bin/pip install .
      - name: Verify forced command, account identity, project scope and live revocation
        run: sudo env GITHUB_ACTIONS=true VPS_GUARDIAN_GATEWAY_INTEGRATION=1 /opt/guardian-gateway-ci/venv/bin/python "$GITHUB_WORKSPACE/tests/test_gateway_integration.py"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check syntax and undefined names
        run: python -m ruff check src tests --select E9,F63,F7,F82
      - name: Run tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v
        env:
          VPS_GUARDIAN_AUDIT_LOG: ${{ runner.temp }}/vps-guardian/audit.jsonl
          VPS_GUARDIAN_STATE_DIR: ${{ runner.temp }}/vps-guardian/state
          VPS_GUARDIAN_SNAPSHOT_DIR: ${{ runner.temp }}/vps-guardian/snapshots
          VPS_GUARDIAN_WORKLOAD_BASELINE_DIR: ${{ runner.temp }}/vps-guardian/workloads
      - name: Measure compact response and tool catalog sizes
        run: python -m tests.response_size_report
      - name: Report coverage
        run: python -m coverage report
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Build and validate PyPI distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate npm launcher
        run: |
          npm test
          node --check src/panel_assets/app.js
