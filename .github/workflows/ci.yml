name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check syntax and undefined names
        run: python -m ruff check src tests --select E9,F63,F7,F82
      - name: Run tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Report coverage
        run: python -m coverage report
      - name: Verify installed dependencies
        run: python -m pip check
