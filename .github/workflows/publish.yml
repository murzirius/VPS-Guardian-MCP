name: Publish packages and MCP Registry metadata

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          # npm Trusted Publishing requires Node 22.14+ and npm 11.5+.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify release versions
        shell: bash
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          package_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          registry_version = json.loads(Path("server.json").read_text(encoding="utf-8"))["version"]
          assert {package_version, project_version, registry_version} == {expected}, (
              f"tag={expected}, npm={package_version}, PyPI={project_version}, registry={registry_version}"
          )
          PY
      - name: Test and package npm launcher
        run: |
          npm test
          npm pack --dry-run
      - name: Build and validate PyPI distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish npm package through trusted publishing
        # OIDC credentials and provenance are issued by npm for this GitHub
        # Actions workflow. No long-lived NPM_TOKEN is used.
        run: npm publish --access public
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@murzirius"
          package-manager-cache: false
      - name: Publish GitHub Packages mirror
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish PyPI package through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Install MCP Registry publisher
        shell: bash
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Validate and publish MCP Registry metadata
        shell: bash
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
